name: 실시간 수집 (1시간마다)

# 이어달리기 방식
#  - GitHub 예약 실행은 붐비면 건너뛰어서(11/3~11/5 하루 몇 번만 실행됨) 믿을 수 없음
#  - 그래서 한 번 실행되면 5시간 반 동안 켜진 채 10분마다 확인하고(scripts/run_loop.ps1),
#    끝나기 직전에 다음 주자를 '직접 실행'으로 띄움 (직접 실행은 바로 처리됨)
#  - 매시 33분 예약은 이어달리기가 끊겼을 때 다시 시작시키는 예비
#  - 같은 시간대는 한 번만 저장하므로 주자가 겹쳐도 자료가 두 번 쌓이지 않음

on:
  schedule:
    - cron: '33 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '이번 주자가 돌 시간(분)'
        required: false
        default: '330'
      alert_test:
        description: '슬랙 #test 로 시험 알림 보내기 (yes / no)'
        required: false
        default: 'no'

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 저장소 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 10분마다 수집 (실시간·매일 작업·항공)
        shell: pwsh
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_TEST: ${{ secrets.SLACK_WEBHOOK_TEST }}   # 놓친 시간 알림 (문제가 있을 때만)
        run: ./scripts/run_loop.ps1 -Minutes ${{ inputs.minutes || '330' }} ${{ inputs.alert_test == 'yes' && '-AlertTest' || '' }}

      - name: 다음 주자 실행 (바통 넘기기)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # 실패하면 20초 간격으로 3번 더 시도하고, 이유를 알림으로 남김 (11/6 01:04 한 번 실패)
        run: |
          for i in 1 2 3 4; do
            if out=$(gh workflow run hourly.yml --ref main 2>&1); then echo "다음 주자 실행함"; exit 0; fi
            echo "::warning::바통 넘기기 실패 ($i번째): $out"
            sleep 20
          done
          exit 1
