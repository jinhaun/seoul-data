name: 실시간 수집 (1시간마다)

on:
  schedule:
    - cron: '33 * * * *'   # 매시 33분 (서울시 인구 데이터가 약 30분 늦게 올라와서 정각 기준 데이터를 받음)
  workflow_dispatch:        # Actions 화면에서 직접 실행 버튼

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 서울 실시간 도시데이터 121곳 수집
        shell: pwsh
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: ./scripts/collect_hourly.ps1

      - name: 사이트 요약 갱신
        if: always()
        shell: pwsh
        run: ./scripts/build_site_data.ps1

      - name: 원본을 Releases에 보관 (저장소 용량 절약)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in tmp/raw/*.json.gz; do
            name=$(basename "$f")
            tag="raw-${name:0:7}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "원본 ${name:0:7}" --notes "1시간마다 받은 서울 실시간 도시데이터 원본 (gzip JSON, 121곳)"
            gh release upload "$tag" "$f" --clobber
          done

      - name: 저장소에 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "실시간 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
